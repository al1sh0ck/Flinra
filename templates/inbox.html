{% extends "base.html" %}

{% block content %}
<h2>Inbox</h2>
{% if messages %}
    <ul>
        {% for msg in messages %}
            <li><strong>From: {{ msg.sender }}</strong><br>{{ msg.message }}<br><small>Sent at: {{ msg.timestamp }}</small></li>
        {% endfor %}
    </ul>
{% else %}
    <p>No messages yet.</p>
{% endif %}
<a href="{{ url_for('main') }}">Back to Main</a>
{% endblock %}
