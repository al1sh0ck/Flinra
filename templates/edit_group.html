<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Редактировать группу</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>
    <div class="profile-container">
        <h1>Редактировать группу</h1>
        <form method="POST">
            <label>Название группы:</label>
            <input type="text" name="name" value="{{ group.name }}" required>

            <label>Описание:</label>
            <input type="text" name="description" value="{{ group.description }}">

            <label>Добавить участников (через запятую):</label>
            <input type="text" name="members" placeholder="user1, user2">

            <div class="buttons">
                <button type="submit">Сохранить изменения</button>
                <a href="{{ url_for('main') }}" class="back">⬅ Назад</a>
            </div>
        </form>
    </div>
</body>
</html>
